name: CI

# The shared job chain in UAMS-Web/uams-ci-workflows, plus the one job a ruleset requires, `CI`.
#
# `uses:` names a release tag, never a branch, so a change to the shared chain reaches this
# repository only when the tag here moves. The called jobs check out this repository, so it
# carries `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts and the Composer
# scripts the jobs call (`test:pint`, `test:refactor`, `stan`, `test:unit`).
#
# `CI` needs the call, runs `if: always()` and fails unless the call reports `success`, so a
# ruleset requires `CI` and never a job by name. Keep `needs:` naming every job in this file.
# The repository is public, so the jobs run without a `RUN_REMOTE_CI` gate.
#
# Mutation testing runs on the PHP files a pull request or a push changes under `mutate-paths`, and
# on everything `composer mutate` covers for a manual run.

on:
  pull_request:
  push:
    branches: [main]
  # The full mutation pass, weekly (Mondays 10:00 UTC), on the default branch. A scheduled run mutates
  # everything `composer mutate` covers, which catches decay no pull request touches.
  schedule:
    - cron: '0 10 * * 1'
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run, so a pull request keeps
# one group. Every other run (a push to the default branch, a manual run) gets a group of its
# own, keyed on the commit, so a later push never cancels it. A shared push group would: GitHub
# keeps one running and one pending run per group and cancels the pending one when another is
# queued, whatever `cancel-in-progress` says, so a merge landing during a long run would cancel
# the previous merge's run before it started a job. Its commit would show a short, settled run
# and the chain would never have run on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.11.1
    with:
      linux-only: true
      mutate-paths: admin uamswp-block-remover.php
      mutate-ignore-paths: admin uamswp-block-remover.php tests
      pest-command: composer test:unit
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call;
  # The `CI` job is the context a ruleset requires.
  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
